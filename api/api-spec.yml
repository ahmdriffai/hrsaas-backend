openapi: 3.0.3
info:
  title: HR SaaS Backend API
  version: 1.0.0
  description: |
    API spec for HR SaaS (Time Off + Visits).
servers:
  - url: http://127.0.0.1:9000
    description: Local
  - url: https://localhost:9000
    description: Local

tags:
  - name: Time Off Requests
  - name: Time Off Types
  - name: Time Off Balances
  - name: Time Off Approvals
  - name: Visits
  - name: Common

security:
  - bearerAuth: []

paths:
  /api/time-off-requests:
    post:
      tags: [Time Off Requests]
      summary: Create time off request
      description: Employee and company scope are derived from bearer token.
      operationId: createTimeOffRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Time Off Requests]
      summary: List time off requests
      operationId: listTimeOffRequests
      parameters:
        - in: query
          name: employee_id
          schema:
            type: string
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: request_status
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/time-off-requests/{id}:
    get:
      tags: [Time Off Requests]
      summary: Get time off request detail
      operationId: getTimeOffRequestById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-requests/_current:
    get:
      tags: [Time Off Requests]
      summary: List current user time off requests
      operationId: listCurrentUserTimeOffRequests
      parameters:
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: request_status
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/time-off-requests/{id}/approvals:
    get:
      tags: [Time Off Approvals]
      summary: List approval steps for request
      operationId: listTimeOffRequestApprovals
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffApprovalListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-requests/{id}/approvals/{approval_id}:
    patch:
      tags: [Time Off Approvals]
      summary: Decide a specific approval step
      operationId: decideTimeOffApprovalStep
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTimeOffApprovalRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-approvals/_current:
    get:
      tags: [Time Off Approvals]
      summary: List approvals assigned to current user
      operationId: listCurrentUserApprovals
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffApprovalListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/time-off-approvals/{approval_id}:
    patch:
      tags: [Time Off Approvals]
      summary: Decide a specific approval by id
      operationId: decideTimeOffApprovalShort
      parameters:
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideTimeOffApprovalRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/visits:
    post:
      tags: [Visits]
      summary: Create visit (IN/OUT) for current user
      operationId: createVisit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVisitRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVisitResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Visits]
      summary: List visits (admin)
      operationId: listVisits
      parameters:
        - in: query
          name: employee_id
          schema:
            type: string
        - in: query
          name: visit_type
          schema:
            $ref: '#/components/schemas/VisitType'
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVisitListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/visits/_current:
    get:
      tags: [Visits]
      summary: List visits for current user
      operationId: listCurrentVisits
      parameters:
        - in: query
          name: visit_type
          schema:
            $ref: '#/components/schemas/VisitType'
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [newest, oldest]
            default: newest
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVisitListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/visits/_current/can-do:
    get:
      tags: [Visits]
      summary: Check if current user can do visit (IN/OUT)
      operationId: canDoVisit
      parameters:
        - in: query
          name: visit_type
          required: true
          schema:
            $ref: '#/components/schemas/VisitType'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessCanDoVisitResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/visits/_current/unclosed:
    get:
      tags: [Visits]
      summary: Get last unclosed visit for current user
      operationId: getUnclosedVisit
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVisitResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/visits/{id}:
    get:
      tags: [Visits]
      summary: Get visit detail (owner or admin)
      operationId: getVisitById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessVisitResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Visits]
      summary: Delete visit by id (owner or admin)
      operationId: deleteVisitById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEmptyResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-requests/{id}/attachments:
    get:
      tags: [Time Off Requests]
      summary: List attachments for a time off request
      operationId: listTimeOffAttachments
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffAttachmentListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Time Off Requests]
      summary: Create attachment for a time off request
      operationId: createTimeOffAttachment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffAttachmentRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffAttachmentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/upload:
    post:
      tags: [Common]
      summary: Upload File
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                path:
                  type: string
                  description: Directory prefix for uploaded files.
                  example: "time-off/sakit/"
      responses:
        '200':
          description: Upload berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/time-off-types:
    get:
      tags: [Time Off Types]
      summary: List time off types
      operationId: listTimeOffTypes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffTypeListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Time Off Types]
      summary: Create time off type
      operationId: createTimeOffType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffTypeRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffTypeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/time-off-balances:
    get:
      tags: [Time Off Balances]
      summary: List balances by employee (admin)
      operationId: listTimeOffBalances
      parameters:
        - in: query
          name: employee_id
          required: true
          schema:
            type: string
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: period_year
          schema:
            type: integer
            minimum: 2000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffBalanceListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/time-off-balances/_set:
    post:
      tags: [Time Off Balances]
      summary: Set time off balance manually (admin)
      operationId: setTimeOffBalance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTimeOffBalanceRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffBalanceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/time-off-balances/_current:
    get:
      tags: [Time Off Balances]
      summary: List current user time off balances
      operationId: listCurrentUserTimeOffBalances
      parameters:
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: period_year
          schema:
            type: integer
            minimum: 2000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffBalanceListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    ApprovalIdPath:
      in: path
      name: approval_id
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    TimeOffCategory:
      type: string
      enum: [IZIN, SAKIT, CUTI]

    VisitType:
      type: string
      enum: [IN, OUT]

    Employee:
      type: object
      properties:
        id:
          type: string
        company_id:
          type: string
        user_id:
          type: string
        employee_number:
          type: string
        fullname:
          type: string
        birth_place:
          type: string
        birth_date:
          type: integer
          format: int64
        blood_type:
          type: string
        marital_status:
          type: string
        religion:
          type: string
        phone:
          type: string
        timezone:
          type: string

    Company:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        logo_url:
          type: string
          nullable: true
        bussiness_field:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        province:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        district:
          type: string
          nullable: true
        village:
          type: string
          nullable: true
        zip_code:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        fax_number:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64

    TimeOffRequest:
      type: object
      properties:
        id:
          type: string
        employee_id:
          type: string
        time_off_type_id:
          type: string
        start_date:
          type: integer
          format: int64
        end_date:
          type: integer
          format: int64
          nullable: true
        requested_days:
          type: integer
          minimum: 1
        request_reason:
          type: string
          nullable: true
        request_status:
          $ref: '#/components/schemas/RequestStatus'
        file_url:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        employee:
          $ref: '#/components/schemas/Employee'
        time_off_type:
          $ref: '#/components/schemas/TimeOffType'
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffRequestApprovalItem'

    TimeOffRequestSummary:
      type: object
      properties:
        id:
          type: string
        employee_id:
          type: string
        time_off_type_id:
          type: string
        start_date:
          type: integer
          format: int64
        end_date:
          type: integer
          format: int64
          nullable: true
        requested_days:
          type: integer
        request_reason:
          type: string
          nullable: true
        request_status:
          $ref: '#/components/schemas/RequestStatus'
        file_url:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        employee:
          $ref: '#/components/schemas/Employee'
        time_off_type:
          $ref: '#/components/schemas/TimeOffType'

    CreateTimeOffRequest:
      type: object
      required:
        - time_off_type_id
        - start_date
        - end_date
        - request_reason
      properties:
        time_off_type_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        request_reason:
          type: string
          maxLength: 255
        request_status:
          type: string
          enum: [PENDING]
          default: PENDING

    DecideTimeOffApprovalRequest:
      type: object
      required:
        - action
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT]
        action_reason:
          type: string
          maxLength: 255
        action_at:
          type: integer
          format: int64
          description: Optional. If omitted, server uses current time.

    TimeOffType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/TimeOffCategory'
        is_quota_based:
          type: boolean
        default_quota_days:
          type: integer
          minimum: 0

    CreateTimeOffTypeRequest:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/TimeOffCategory'
        is_quota_based:
          type: boolean
          default: false
        default_quota_days:
          type: integer
          minimum: 0
          default: 0

    UploadSuccessResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UploadedFileItem'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    UploadedFileItem:
      type: object
      properties:
        file_url:
          type: string
          example: http://example.com/uploads/time-off/sakit/file.jpg
      required: [file_url]

    Visit:
      type: object
      properties:
        id:
          type: string
        employee_id:
          type: string
        company_id:
          type: string
        visit_type:
          $ref: '#/components/schemas/VisitType'
        note:
          type: string
          nullable: true
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        file_name:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        file_size:
          type: integer
          nullable: true
        file_url:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        employee:
          $ref: '#/components/schemas/Employee'
        company:
          $ref: '#/components/schemas/Company'

    CreateVisitRequest:
      type: object
      required:
        - visit_type
      properties:
        visit_type:
          $ref: '#/components/schemas/VisitType'
        note:
          type: string
          nullable: true
        latitude:
          type: string
          nullable: true
        longitude:
          type: string
          nullable: true
        address:
          type: string
          nullable: true
        file_url:
          type: string
          nullable: true

    CanDoVisit:
      type: object
      properties:
        can_do_visit:
          type: boolean
        message:
          type: string
