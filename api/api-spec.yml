openapi: 3.0.3
info:
  title: HR SaaS Backend - Time Off API
  version: 1.0.0
  description: |
    API spec for Time Off feature.
servers:
  - url: http://127.0.0.1:9000
    description: Local
  - url: https://localhost:9000
    description: Local

tags:
  - name: Time Off Requests
  - name: Time Off Types
  - name: Time Off Balances
  - name: Time Off Approvals
  - name: Common

security:
  - bearerAuth: []

paths:
  /api/time-off-requests:
    post:
      tags: [Time Off Requests]
      summary: Create time off request
      description: Employee and company scope are derived from bearer token.
      operationId: createTimeOffRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
    get:
      tags: [Time Off Requests]
      summary: List time off requests
      operationId: listTimeOffRequests
      parameters:
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: request_status
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/time-off-requests/{id}:
    get:
      tags: [Time Off Requests]
      summary: Get time off request detail
      operationId: getTimeOffRequestById
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-requests/_current:
    get:
      tags: [Time Off Requests]
      summary: List current user time off requests
      operationId: listCurrentUserTimeOffRequests
      parameters:
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: request_status
          schema:
            $ref: '#/components/schemas/RequestStatus'
        - in: query
          name: start_date
          schema:
            type: string
            format: date
        - in: query
          name: end_date
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffRequestListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/time-off-requests/{id}/approvals:
    get:
      tags: [Time Off Approvals]
      summary: List approval steps for request
      operationId: listTimeOffRequestApprovals
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffApprovalListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-requests/{id}/approvals/{approval_id}/approve:
    patch:
      tags: [Time Off Approvals]
      summary: Approve a specific approval step
      operationId: approveTimeOffApprovalStep
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTimeOffRequest'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-requests/{id}/approvals/{approval_id}/reject:
    patch:
      tags: [Time Off Approvals]
      summary: Reject a specific approval step
      operationId: rejectTimeOffApprovalStep
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTimeOffRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-approvals/_current:
    get:
      tags: [Time Off Approvals]
      summary: List approvals assigned to current user
      operationId: listCurrentUserApprovals
      parameters:
        - in: query
          name: status
          schema:
            $ref: '#/components/schemas/ApprovalStatus'
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: size
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffApprovalListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/time-off-approvals/{approval_id}/approve:
    patch:
      tags: [Time Off Approvals]
      summary: Approve a specific approval by id (short path)
      operationId: approveTimeOffApprovalShort
      parameters:
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveTimeOffRequest'
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-approvals/{approval_id}/reject:
    patch:
      tags: [Time Off Approvals]
      summary: Reject a specific approval by id (short path)
      operationId: rejectTimeOffApprovalShort
      parameters:
        - $ref: '#/components/parameters/ApprovalIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectTimeOffRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEmptyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/time-off-requests/{id}/attachments:
    get:
      tags: [Time Off Requests]
      summary: List attachments for a time off request
      operationId: listTimeOffAttachments
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffAttachmentListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Time Off Requests]
      summary: Create attachment for a time off request
      operationId: createTimeOffAttachment
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffAttachmentRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffAttachmentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/upload:
    post:
      tags: [Common]
      summary: Upload File
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                path:
                  type: string
                  description: Directory prefix for uploaded files.
                  example: "time-off/sakit/"
      responses:
        '200':
          description: Upload berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSuccessResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Payload too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/time-off-types:
    get:
      tags: [Time Off Types]
      summary: List time off types
      operationId: listTimeOffTypes
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffTypeListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Time Off Types]
      summary: Create time off type
      operationId: createTimeOffType
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTimeOffTypeRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffTypeResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/time-off-balances:
    get:
      tags: [Time Off Balances]
      summary: List balances
      operationId: listTimeOffBalances
      parameters:
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: period_year
          schema:
            type: integer
            minimum: 2000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffBalanceListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/time-off-balances/_current:
    get:
      tags: [Time Off Balances]
      summary: List current user time off balances
      operationId: listCurrentUserTimeOffBalances
      parameters:
        - in: query
          name: time_off_type_id
          schema:
            type: string
        - in: query
          name: period_year
          schema:
            type: integer
            minimum: 2000
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessTimeOffBalanceListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    IdPath:
      in: path
      name: id
      required: true
      schema:
        type: string
    ApprovalIdPath:
      in: path
      name: approval_id
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    RequestStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED]

    TimeOffCategory:
      type: string
      enum: [IZIN, SAKIT, CUTI]

    TimeOffRequest:
      type: object
      properties:
        id:
          type: string
        employee_id:
          type: string
        time_off_type_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        requested_days:
          type: integer
          minimum: 1
        request_reason:
          type: string
        request_status:
          $ref: '#/components/schemas/RequestStatus'
        action_by:
          type: string
          nullable: true
        action_at:
          type: string
          format: date-time
          nullable: true
        action_reason:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CreateTimeOffRequest:
      type: object
      required:
        - time_off_type_id
        - start_date
        - end_date
        - requested_days
        - request_reason
      properties:
        time_off_type_id:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        requested_days:
          type: integer
          minimum: 1
        request_reason:
          type: string
          maxLength: 255

    ApproveTimeOffRequest:
      type: object
      properties:
        action_reason:
          type: string
          maxLength: 255
          description: Optional note when approving.

    RejectTimeOffRequest:
      type: object
      required:
        - action_reason
      properties:
        action_reason:
          type: string
          maxLength: 255

    TimeOffType:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/TimeOffCategory'
        is_quota_based:
          type: boolean
        default_quota_days:
          type: integer
          minimum: 0

    CreateTimeOffTypeRequest:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          maxLength: 100
        category:
          $ref: '#/components/schemas/TimeOffCategory'
        is_quota_based:
          type: boolean
          default: false
        default_quota_days:
          type: integer
          minimum: 0
          default: 0

    UploadSuccessResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/UploadedFileItem'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    UploadedFileItem:
      type: object
      properties:
        file_url:
          type: string
          example: http://example.com/uploads/time-off/sakit/file.jpg
      required: [file_url]

    TimeOffBalance:
      type: object
      properties:
        id:
          type: string
        employee_id:
          type: string
        time_off_type_id:
          type: string
        period_year:
          type: integer
        entitled_days:
          type: integer
          minimum: 0
        used_days:
          type: integer
          minimum: 0
        remaining_days:
          type: integer

    ApprovalStatus:
      type: string
      enum: [PENDING, APPROVED, REJECTED, SKIPPED]

    TimeOffRequestApproval:
      type: object
      properties:
        id:
          type: string
        time_off_request_id:
          type: string
        step_no:
          type: integer
        approver_employee_id:
          type: string
        approver_name:
          type: string
        approver_position:
          type: string
        approver_division:
          type: string
        status:
          $ref: '#/components/schemas/ApprovalStatus'
        action_at:
          type: string
          format: date-time
          nullable: true
        action_reason:
          type: string
          nullable: true


    PageMetadata:
      type: object
      properties:
        page:
          type: integer
        size:
          type: integer
        total_item:
          type: integer
        total_page:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Unauthorized

    SuccessTimeOffRequestResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TimeOffRequest'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessTimeOffRequestListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffRequest'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessTimeOffTypeResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TimeOffType'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessTimeOffTypeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffType'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessTimeOffBalanceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffBalance'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessTimeOffApprovalListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffRequestApproval'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessTimeOffApprovalResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TimeOffRequestApproval'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessEmptyResponse:
      type: object
      properties:
        data:
          nullable: true
          example: null
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    TimeOffAttachment:
      type: object
      properties:
        id:
          type: string
        time_off_request_id:
          type: string
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        file_url:
          type: string

    CreateTimeOffAttachmentRequest:
      type: object
      required: [file_name, mime_type, file_size, file_url]
      properties:
        file_name:
          type: string
        mime_type:
          type: string
        file_size:
          type: integer
        file_url:
          type: string

    SuccessTimeOffAttachmentResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/TimeOffAttachment'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true

    SuccessTimeOffAttachmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TimeOffAttachment'
        paging:
          $ref: '#/components/schemas/PageMetadata'
        errors:
          type: string
          nullable: true
